name: 打包三平台

# 触发方式：
#   1) 手动：Actions → 打包三平台 → Run workflow（只出产物，不发版）
#   2) 推 tag：`git push origin v0.2.0` → 构建 + 自动创建 GitHub Release
#
# 为什么 mac/linux 要走 CI：macOS 的 .app 必须在 macOS 上构建并签名
# （改完 bundle 不重签会被判「已损坏」），Linux 的 AppImage 需要 mksquashfs。
# 本机（Windows）只能出 win 的 nsis/portable 和 linux 的 tar.gz。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64（nsis + 免安装）
            args: --win
          - os: macos-latest
            label: macOS（x64 + arm64）
            args: --mac
          - os: ubuntu-latest
            label: Linux x64（AppImage + deb）
            args: --linux

    env:
      # 海外 runner 可以删掉这两个镜像变量
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
      # 未做代码签名，别让 electron-builder 去找证书
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # 单测里有「订单时间按本地时区格式化」的断言（写死了 +08:00），
      # runner 默认是 UTC，不固定时区会差 8 小时
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 发版一致性：tag 与 package.json 的 version 必须对得上，
      # 否则 Release 上会出现「标签 v0.2.1、包内版本 0.2.0」这种错位
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致，先把版本号改齐再打 tag"
            exit 1
          fi
          echo "版本一致：v$TAG"

      - name: 安装依赖
        run: npm ci

      # 私钥不入库，CI 上现生成；openssl 缺失时跳过，MITM 通道会退化为不可用，
      # 其余抓取（WebView 注入通道）不受影响
      - name: 生成内置 MITM 证书
        continue-on-error: true
        run: node scripts/gen-mitm-certs.mjs

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建主进程 / preload / 渲染层
        run: npx electron-vite build

      - name: 打包
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Windows 宿主打的 tar 不带可执行位，Linux 上解压后跑不起来
      - name: 修正 tar 可执行位
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/fix-linux-tar.mjs dist-release/*.tar.gz || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: reflow-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/*.AppImage
            dist-release/*.deb
            dist-release/*.tar.gz
            dist-release/*.blockmap

  # 只在推 tag 时跑：把三个平台的产物汇总成一个 GitHub Release
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成发布说明（取自 docs/CHANGELOG.md）
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: 生成校验值
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "回流 Reflow $TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
          gh release view "$TAG" --json url -q .url
