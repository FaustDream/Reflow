# 持续检查：类型 + 单测 + 构建管线（2026-11-08 起）。
# 旧 build.yml 的三平台桌面打包流水线已随桌面版下线一并移除。
#
# electron-vite build 产出 out/（主进程 / preload / renderer 三个 bundle），
# 是主进程与渲染层能否完整编译的门禁；网页版开发时 out/ 由 dev server 现编。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 类型检查 + 单测 + 构建
    runs-on: ubuntu-latest

    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      # 单测里有「订单时间按本地时区格式化」的断言（写死了 +08:00），
      # runner 默认是 UTC，不固定时区会差 8 小时
      TZ: Asia/Shanghai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（node + preload + web）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建主进程 / preload / 渲染层
        run: npx electron-vite build
